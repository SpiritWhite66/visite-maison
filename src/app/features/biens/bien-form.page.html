@if (bien(); as b) {
  <header class="entete-page">
    <div>
      <a class="fil" [routerLink]="id() ? ['/biens', b.id] : ['/biens']"><app-icone nom="gauche" [taille]="18" /> {{ id() ? b.titre : 'Biens' }}</a>
      <h1>{{ id() ? 'Modifier le bien' : 'Nouveau bien' }}</h1>
    </div>
  </header>
  <form (ngSubmit)="enregistrer()">
    <section class="bloc-form">
      <h2>Le bien</h2>
      <div class="champs">
      <label class="champ">Titre
        <input name="titre" [(ngModel)]="b.titre" placeholder="Longère Lombez 4 ch." required />
      </label>
      <label class="champ">Type
        <select name="typeBien" [(ngModel)]="b.typeBien">
          <option value="VILLE">Maison en ville / lotissement</option>
          <option value="RURAL">Maison rurale avec terrain</option>
        </select>
      </label>
      <label class="champ">Lien de l'annonce
        <input name="url" type="url" inputmode="url" [(ngModel)]="b.urlAnnonce" />
      </label>
      <label class="champ">Adresse
        <input name="adresse" [(ngModel)]="b.adresse" />
      </label>
      <label class="champ">Commune
        <input name="commune" [(ngModel)]="b.commune" />
      </label>
      </div>
    </section>

    <section class="bloc-form">
      <h2>Prix</h2>
      <div class="champs">
      <div class="grille-2">
        <label class="champ">Prix affiché (€)
          <input name="prix" type="number" inputmode="decimal" min="0" [(ngModel)]="b.prixAffiche" />
        </label>
        <label class="champ">Marge visée (%)
          <input name="marge" type="number" inputmode="decimal" min="0" max="100" step="0.5" [(ngModel)]="b.margeNegociationPct" />
        </label>
      </div>
      </div>
    </section>

    <section class="bloc-form">
      <h2>Caractéristiques</h2>
      <div class="champs">
      <div class="grille-2">
        <label class="champ">Surface habitable (m²)
          <input name="shab" type="number" inputmode="decimal" min="0" [(ngModel)]="b.surfaceHabitable" />
        </label>
        <label class="champ">Terrain (m²)
          <input name="sterr" type="number" inputmode="decimal" min="0" [(ngModel)]="b.surfaceTerrain" />
        </label>
        <label class="champ">Année de construction
          <input name="annee" type="number" inputmode="numeric" min="1000" max="2100" [(ngModel)]="b.anneeConstruction" />
        </label>
        <label class="champ">Impression globale
          <select name="impression" [(ngModel)]="b.impressionGlobale">
            <option [ngValue]="null">—</option>
            @for (n of [1, 2, 3, 4, 5]; track n) {
              <option [ngValue]="n">{{ n }} / 5</option>
            }
          </select>
        </label>
        <label class="champ">DPE
          <select name="dpe" [(ngModel)]="b.dpe">
            <option [ngValue]="null">—</option>
            @for (n of notes; track n) {
              <option [ngValue]="n">{{ n }}</option>
            }
          </select>
        </label>
        <label class="champ">GES
          <select name="ges" [(ngModel)]="b.ges">
            <option [ngValue]="null">—</option>
            @for (n of notes; track n) {
              <option [ngValue]="n">{{ n }}</option>
            }
          </select>
        </label>
      </div>
      </div>
    </section>

    <section class="bloc-form">
      <h2>Contact</h2>
      <div class="champs">
      <label class="champ">Nom
        <input name="cnom" [(ngModel)]="b.contact.nom" />
      </label>
      <label class="champ">Agence
        <input name="cagence" [(ngModel)]="b.contact.agence" />
      </label>
      <label class="champ">Téléphone
        <input name="ctel" type="tel" [(ngModel)]="b.contact.telephone" />
      </label>
      <label class="champ">E-mail
        <input name="cmail" type="email" [(ngModel)]="b.contact.email" />
      </label>
      </div>
    </section>

    <section class="bloc-form">
      <h2>Notes</h2>
      <div class="champs">
        <label class="champ">Notes libres
          <textarea name="notes" rows="4" [(ngModel)]="b.notes"></textarea>
        </label>
      </div>
    </section>

    @if (erreur()) {
      <p class="erreur" role="alert">{{ erreur() }}</p>
    }
    <div class="barre-actions">
      <a class="bouton bouton-secondaire" [routerLink]="id() ? ['/biens', b.id] : ['/biens']">Annuler</a>
      <button type="submit">Enregistrer</button>
    </div>
  </form>
}
