@if (piece(); as p) {
  <header class="entete-page">
    <div>
      <a class="fil" [routerLink]="['/biens', id()]" [queryParams]="{ onglet: 'pieces' }"><app-icone nom="gauche" [taille]="18" /> Pièces</a>
      <h1>{{ p.nom.trim() || 'Nouvelle pièce' }}</h1>
    </div>
    <span class="etat-auto" [class.ok]="p.nom.trim() && enregistre()" aria-live="polite">
      @if (p.nom.trim()) {
        @if (enregistre()) { <app-icone nom="coche" [taille]="16" /> Enregistré } @else { Enregistrement… }
      } @else { Donnez-lui un nom pour l’enregistrer }
    </span>
  </header>

  <section class="bloc-form">
    <h2>Pièce</h2>
    <div class="champs">
    <label class="champ">Nom
      <input name="nom" placeholder="Séjour, Grange…" [(ngModel)]="p.nom" (ngModelChange)="modifie()" />
    </label>
    <div class="grille-2">
      <label class="champ">Longueur (m)
        <input name="longueur" type="number" inputmode="decimal" min="0" step="any" [(ngModel)]="p.longueur" (ngModelChange)="modifie()" />
      </label>
      <label class="champ">Largeur (m)
        <input name="largeur" type="number" inputmode="decimal" min="0" step="any" [(ngModel)]="p.largeur" (ngModelChange)="modifie()" />
      </label>
      <label class="champ">Surface (m²)
        @if (p.longueur && p.largeur) {
          <input name="surface-calculee" [value]="nombre(surface(p) ?? 0) + ' (calculée)'" disabled />
        } @else {
          <input name="surface" type="number" inputmode="decimal" min="0" step="any" [(ngModel)]="p.surface" (ngModelChange)="modifie()" />
        }
      </label>
      <label class="champ">Hauteur sous plafond (m)
        <input name="hauteur" type="number" inputmode="decimal" min="0" step="any" [(ngModel)]="p.hauteurSousPlafond" (ngModelChange)="modifie()" />
      </label>
    </div>
    <label class="champ">Notes
      <textarea name="notes" rows="3" [(ngModel)]="p.notes" (ngModelChange)="modifie()"></textarea>
    </label>
    </div>
    </section>

  <section class="bloc-form">
    <h2>Photos</h2>
    <div class="champs">
    <app-galerie-photos class="large" [photoIds]="p.photoIds" (supprimer)="retirerPhoto($event)" [peutDefinirCouverture]="true" [couvertureId]="couvertureId()" (couverture)="definirCouverture($event)" />
    <div class="actions large">
      <app-ajout-photo [desactive]="photoEnCours() || !p.nom.trim()" (choisie)="ajouterPhoto($event)" />
    </div>
    @if (!p.nom.trim()) { <p class="discret large">Saisissez d’abord un nom.</p> }
    </div>
    </section>

  <div class="barre-actions">
    @if (existe()) {
      <button type="button" class="bouton-texte danger" (click)="supprimer()"><app-icone nom="corbeille" [taille]="18" /> Supprimer</button>
    }
    <a class="bouton" [routerLink]="['/biens', id()]" [queryParams]="{ onglet: 'pieces' }">Terminé</a>
  </div>
}
