name: Build & déploiement GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm test -- --watch=false
      - run: npx ng build --base-href "/${{ github.event.repository.name }}/"
      # Routing côté client : GitHub Pages sert 404.html pour les URL inconnues
      - run: cp dist/visite-immo/browser/index.html dist/visite-immo/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/visite-immo/browser

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
